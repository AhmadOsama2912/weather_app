name: weather_app
description: "Weather app task"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.8.1 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  bloc: ^9.2.0
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8

  # Networking
  dio: ^5.9.1

  # Storage
  shared_preferences: ^2.5.3

  # Location
  geolocator: ^14.0.2
  geocoding: ^4.0.0

  # Date formatting / i18n
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # App Icon + Splash
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/l10n/
    - assets/icon/

# ===== App Icon =====
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

  # Optional (recommended) adaptive icon config for Android
  adaptive_icon_background: "#0B0F1E"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

# ===== Splash Screen =====
flutter_native_splash:
  android: true
  ios: true
  web: true

  # Light theme splash
  color: "#F4F7FF"
  image: "assets/icon/app_icon.png"

  # Dark theme splash
  color_dark: "#0B0F1E"
  image_dark: "assets/icon/app_icon.png"

  # Android 12+ requires special section
  android_12:
    color: "#F4F7FF"
    image: "assets/icon/app_icon.png"
    color_dark: "#0B0F1E"
    image_dark: "assets/icon/app_icon.png"
